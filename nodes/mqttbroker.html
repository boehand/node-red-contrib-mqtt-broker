<script type="text/javascript">
    RED.nodes.registerType('mqttbroker', {
        category: 'network',
        color: '#D8BFD8',
        defaults: {
            name:                 { value: '' },
            port:                 { value: 1883, required: true, validate: RED.validators.number() },
            bind:                 { value: '' },
            allowAnonymous:       { value: true },
            persistence:          { value: false },
            persistenceLocation:  { value: '' },
            binaryPath:           { value: '' },
            configPath:           { value: '' },
            installScope:         { value: 'auto' },
            updateCheckEnabled:   { value: true },
            updateCheckInterval:  { value: 15, validate: RED.validators.number() },
            logToConsole:         { value: false },
            logToTerminal:        { value: false }
        },
        credentials: {
            username: { type: 'text' },
            password: { type: 'password' }
        },
        inputs: 1,
        outputs: 3,
        outputLabels: ['Data (status / topics / get / update)', 'Server logs (stdout / stderr)', 'Admin alerts (crash / update / errors)'],
        icon: 'bridge.svg',
        label: function () {
            return this.name || ('mqtt :' + (this.port || 1883));
        },
        paletteLabel: 'mqtt broker',
        oneditprepare: function () {
            const customConfig = $('#node-input-configPath');
            const toggleCustom = () => {
                const hasCustom = !!customConfig.val();
                $('.mqtt-broker-generated-only').toggle(!hasCustom);
            };
            customConfig.on('input change', toggleCustom);
            toggleCustom();

            const persistence = $('#node-input-persistence');
            const togglePersistence = () => {
                $('.mqtt-broker-persistence-only').toggle(persistence.is(':checked'));
            };
            persistence.on('change', togglePersistence);
            togglePersistence();

            const updateEnabled = $('#node-input-updateCheckEnabled');
            const toggleUpdate = () => {
                $('.mqtt-broker-update-only').toggle(updateEnabled.is(':checked'));
            };
            updateEnabled.on('change', toggleUpdate);
            toggleUpdate();

            // Prefill the two path fields with the actual resolved values
            // so users can copy them, replace them with their own path, or
            // leave them alone. The stored config value is whatever is in
            // the input at save time, so each prefilled path takes effect
            // exactly as a hand-typed path would.
            const nodeId = this.id || '<node-id>';
            const scopeSelect = $('#node-input-installScope');
            const persistenceInput = $('#node-input-persistenceLocation');
            const binaryInput = $('#node-input-binaryPath');

            const refreshDefaults = () => {
                $.getJSON('mqttbroker/defaults?scope=' + encodeURIComponent(scopeSelect.val() || 'any'),
                    (data) => {
                        if (!data) return;
                        const sep = data.pathSep || (data.platform === 'win32' ? '\\' : '/');
                        if (data.persistenceBase && !persistenceInput.val()) {
                            persistenceInput.val(data.persistenceBase + sep + nodeId + sep);
                        }
                        if (data.resolvedBinary && !binaryInput.val()) {
                            binaryInput.val(data.resolvedBinary);
                        }
                    });
            };
            refreshDefaults();
            // Re-resolve the binary when the user switches scope, but only
            // overwrite the field when it is still empty - never clobber a
            // path the user typed themselves.
            scopeSelect.on('change', refreshDefaults);

            // Show update banner if an update is already known for this node.
            if (nodeId !== '<node-id>') {
                $.getJSON('mqttbroker/' + nodeId + '/update-status', (info) => {
                    if (!info || !info.updateAvailable) return;
                    $('#mqtt-broker-update-versions').text(info.installed + ' → ' + info.latest);
                    $('#mqtt-broker-update-banner').show();
                });
            }

            $('#mqtt-broker-update-btn').on('click', function () {
                const btn = $(this);
                const result = $('#mqtt-broker-update-result');
                btn.prop('disabled', true).text('Installing…');
                result.text('').css('color', '');
                $.ajax({
                    url: 'mqttbroker/' + nodeId + '/do-update',
                    type: 'POST',
                    contentType: 'application/json',
                    success: function () {
                        btn.text('Done ✓');
                        result.text('Update installed. Broker is restarting.').css('color', 'green');
                        $('#mqtt-broker-update-banner').delay(3000).fadeOut();
                    },
                    error: function (xhr) {
                        btn.prop('disabled', false).text('Install now');
                        const msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText;
                        result.text('Error: ' + msg).css('color', 'red');
                    }
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="mqttbroker">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">

        <label for="node-input-allowAnonymous" style="width:auto"><i class="fa fa-user-o"></i> Allow anonymous</label>

    </div>
    <div class="form-row mqtt-broker-generated-only">
        <label for="node-input-persistence" style="width:auto"><i class="fa fa-database"></i> Persistence</label>
        <input type="checkbox" id="node-input-persistence" style="width:auto; margin-left:6px">
    </div>
    <div class="form-row mqtt-broker-generated-only mqtt-broker-persistence-only">
        <label for="node-input-persistenceLocation"><i class="fa fa-folder-open-o"></i> Persistence path</label>
        <input type="text" id="node-input-persistenceLocation"
               placeholder="auto-filled with default; overwrite to point elsewhere">
    </div>
    <div class="form-row mqtt-broker-generated-only">
        <label for="node-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-input-username" placeholder="optional">
    </div>
    <div class="form-row mqtt-broker-generated-only">
        <label for="node-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-input-password" placeholder="optional">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-installScope"><i class="fa fa-cubes"></i> Install scope</label>
        <select id="node-input-installScope" style="width:70%">
            <option value="auto">Auto (reuse any existing mosquitto; install LOCAL if missing)</option>
            <option value="global">Global (system-wide, via OS package manager)</option>
            <option value="local">Local (inside this module's vendor folder)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-binaryPath"><i class="fa fa-terminal"></i> Mosquitto binary</label>
        <input type="text" id="node-input-binaryPath"
               placeholder="auto-filled with resolved path; overwrite to pin a different binary">
    </div>
    <div class="form-row">
        <label for="node-input-configPath"><i class="fa fa-file-o"></i> Config file</label>
        <input type="text" id="node-input-configPath" placeholder="optional; overrides settings above">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-updateCheckEnabled" style="width:auto"><i class="fa fa-refresh"></i> Check for updates</label>
        <input type="checkbox" id="node-input-updateCheckEnabled" style="width:auto; margin-left:6px">
    </div>
    <div class="form-row mqtt-broker-update-only">
        <label for="node-input-updateCheckInterval"><i class="fa fa-clock-o"></i> Interval (min)</label>
        <input type="number" id="node-input-updateCheckInterval" min="1" placeholder="15" style="width:120px">
    </div>
    <div class="form-row mqtt-broker-update-only" id="mqtt-broker-update-banner" style="display:none">
        <label style="width:auto"><i class="fa fa-arrow-circle-up" style="color:#e6a817"></i> Update available</label>
        <span id="mqtt-broker-update-versions" style="margin-left:6px; font-family:monospace"></span>
        <button type="button" id="mqtt-broker-update-btn"
                style="margin-left:12px" class="red-ui-button red-ui-button-small">
            Install now
        </button>
        <span id="mqtt-broker-update-result" style="margin-left:8px; font-size:0.9em"></span>
    </div>
    <div class="form-row">
        <label for="node-input-logToConsole" style="width:auto"><i class="fa fa-file-text-o"></i> Show broker logs in Debug sidebar</label>
        <input type="checkbox" id="node-input-logToConsole" style="width:auto; margin-left:6px">
    </div>
    <div class="form-row">
        <label for="node-input-logToTerminal" style="width:auto"><i class="fa fa-terminal"></i> Also log to terminal (stdout/stderr)</label>
        <input type="checkbox" id="node-input-logToTerminal" style="width:auto; margin-left:6px">
    </div>
</script>

<script type="text/html" data-help-name="mqttbroker">
    <p>Starts and supervises a <a href="https://mosquitto.org/">Mosquitto</a>
       MQTT broker as a child process of Node-RED.</p>

    <h3>Install scope</h3>
    <ul>
        <li><b>Auto</b>: if any mosquitto binary is already on the machine
            it is reused (no duplicate install). If none is found, a
            <b>local</b> install is attempted first (no sudo, no system
            pollution). Only if that fails does the node fall back to a
            global install.</li>
        <li><b>Global</b>: forces the system-wide install path (apt/dnf/yum
            /zypper/pacman/apk on Linux, Homebrew on macOS,
            winget/choco/direct download on Windows). Skipped if a global
            install is already present.</li>
        <li><b>Local</b>: installs into this module's
            <code>vendor/&lt;platform&gt;-&lt;arch&gt;/</code> directory.
            <ul>
                <li>Linux (Debian/Ubuntu): uses <code>apt-get download</code>
                    + <code>dpkg-deb -x</code>, no root required.</li>
                <li>Windows: runs the NSIS installer with
                    <code>/D=&lt;vendor dir&gt;</code>.</li>
                <li>macOS: not supported - falls back to a warning.</li>
            </ul>
            If a global install also exists the node logs a note but will
            use the local copy.</li>
    </ul>

    <h3>Mosquitto binary</h3>
    <p>Absolute path to the <code>mosquitto</code> / <code>mosquitto.exe</code>
       executable. When you open the node dialog the field is pre-filled
       with the path the node currently resolves for the selected
       <i>Install scope</i>, so you can copy it or replace it with your
       own. What you save is what the runtime uses:</p>
    <ul>
        <li>Field filled (default or custom) &rarr; that exact binary is
            used. The auto-installer is skipped.</li>
        <li>Field emptied &rarr; the runtime auto-locates the binary via
            the <i>Install scope</i> on every start (recommended when you
            want updates via the install scope to take effect automatically).</li>
    </ul>
    <p>If you change the <i>Install scope</i> while the field is empty,
       the auto-resolved path is refreshed; if the field already contains
       a path it is left alone.</p>

    <h3>Update check</h3>
    <p>When enabled, the node queries the official Mosquitto release feed
       shortly after startup and then every <i>N</i> minutes (default 15,
       configurable). When a newer version is found:</p>
    <ul>
        <li>The node status on the canvas turns <b>yellow</b> and shows
            the version transition, e.g.
            <code>update 2.0.18 → 2.0.19</code>.</li>
        <li>An <b>Install now</b> button appears inside the node's config
            dialog — click it to install the update without touching any
            flow.</li>
        <li>A message is emitted on <code>mosquitto/update</code>.</li>
        <li>You can also send <code>payload: "update"</code> to trigger the
            install from a flow.</li>
    </ul>
    <p>During the install the broker is stopped, the new binary is fetched
       at the configured scope, and then the broker is restarted. Send
       <code>payload: "check-update"</code> to force an immediate check.</p>

    <h3>Persistence path</h3>
    <p>When <b>Persistence</b> is on, the field is pre-filled with the
       default path
       <code>&lt;Node-RED userDir&gt;/mqtt-broker-persistence/&lt;node-id&gt;/</code>
       so it can be copied or replaced with your own path (e.g.
       <code>/var/lib/mosquitto/</code> or
       <code>C:\\ProgramData\\mosquitto\\</code>). Whatever is saved in the
       field is what the runtime writes into Mosquitto's
       <code>persistence_location</code>; the directory is created if it
       does not exist. Empty the field to fall back to the default
       lookup at runtime.</p>

    <h3>Log visibility</h3>
    <p>The two independent checkboxes at the bottom of the config control
       where the broker output is echoed in addition to the
       <code>mosquitto/stdout</code> / <code>mosquitto/stderr</code>
       messages:</p>
    <ul>
        <li><b>Show broker logs in Debug sidebar</b> - every stdout/stderr
            line is surfaced via <code>node.warn()</code>, which Node-RED
            shows in the <i>Debug</i> sidebar of the editor and in the
            server log.</li>
        <li><b>Also log to terminal (stdout/stderr)</b> - every line is
            additionally written directly to the Node-RED process'
            <code>stdout</code> / <code>stderr</code>. This bypasses the
            Node-RED logger level so the output is visible even when
            Node-RED is started from a terminal without any logger config
            tweaks, or when Node-RED runs under a service that forwards
            stdout to <code>journalctl</code> / a log file.</li>
    </ul>
    <p>Both can be enabled together or independently.</p>

    <h3>Prerequisites</h3>
    <p>A post-install script installs <code>mosquitto</code> automatically
       at the configured scope. To suppress it during
       <code>npm install</code>, set
       <code>SKIP_MOSQUITTO_INSTALL=1</code>. To pin the Windows fallback
       installer version, set <code>MOSQUITTO_WIN_VERSION=2.0.20</code>.</p>

    <h3>Self-heal on first deploy</h3>
    <p>If the binary is missing when the node first starts, the runtime
       runs the installer once and only then spawns the broker.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt>
        <dd>Control command: <code>start</code>, <code>stop</code>,
            <code>restart</code>, <code>status</code>, <code>install</code>,
            <code>check-update</code>, <code>update</code>,
            <code>topics</code>, or <code>get</code>. Object form:
            <code>{ command: 'install', scope: 'local' }</code>.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>For <code>get</code>: the topic name to fetch. Also accepted
            as <code>payload.topic</code>.</dd>
    </dl>

    <h3>Topic inspection</h3>
    <p>The node maintains an in-memory map of every topic it has seen
       since the broker started, together with the last payload, QoS,
       retain flag, and timestamp.</p>

    <h3>Outputs</h3>
    <p>The node has <b>three separate outputs</b> so each concern can be wired
       independently (e.g. output 3 directly into an email node).</p>
    <dl class="message-properties">
        <dt>Output 1 — Data <span class="property-type">object</span></dt>
        <dd>Responses to input commands.
            <code>topic</code> is one of
            <code>mosquitto/status</code>, <code>mosquitto/install</code>,
            <code>mosquitto/update</code>, <code>mosquitto/topics</code>,
            <code>mosquitto/get</code>.</dd>
        <dt>Output 2 — Server logs <span class="property-type">string</span></dt>
        <dd>Every stdout and stderr line from the Mosquitto process.
            <code>topic</code> is <code>mosquitto/stdout</code> or
            <code>mosquitto/stderr</code>;
            <code>payload</code> is the raw log line.</dd>
        <dt>Output 3 — Admin alerts <span class="property-type">object</span></dt>
        <dd>Important events worth emailing to an administrator.
            <code>topic</code> is always <code>mosquitto/alert</code>.
            <code>payload</code>:
            <ul>
                <li><code>event</code> — one of
                    <code>crash</code>, <code>spawn-error</code>,
                    <code>port-in-use</code>, <code>start-failed</code>,
                    <code>install-failed</code>, <code>update-available</code>,
                    <code>update-install-failed</code></li>
                <li><code>level</code> — <code>"info"</code> or <code>"error"</code></li>
                <li><code>message</code> — human-readable description</li>
                <li><code>details</code> — event-specific object (port, version, binary path, …)</li>
                <li><code>timestamp</code> — Unix ms</li>
            </ul>
        </dd>
    </dl>

    <h3>Details</h3>
    <p>If a custom config file is supplied, all other settings on the node
       are ignored - the file is passed verbatim to
       <code>mosquitto -c</code>. Otherwise, a temporary config is generated
       from the fields above. The broker starts on deploy and is stopped
       cleanly when the node is redeployed or Node-RED shuts down.</p>
    <p>If the broker exits unexpectedly, the node will restart it after
       five seconds.</p>
</script>
