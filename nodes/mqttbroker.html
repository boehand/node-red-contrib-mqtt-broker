<script type="text/javascript">
    RED.nodes.registerType('mqtt-broker', {
        category: 'network',
        color: '#D8BFD8',
        defaults: {
            name:          { value: '' },
            port:          { value: 1883, required: true, validate: RED.validators.number() },
            bind:          { value: '' },
            allowAnonymous:{ value: true },
            persistence:   { value: false },
            binaryPath:    { value: '' },
            configPath:    { value: '' },
            logToConsole:  { value: false }
        },
        credentials: {
            username: { type: 'text' },
            password: { type: 'password' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.svg',
        label: function () {
            return this.name || ('mqtt :' + (this.port || 1883));
        },
        paletteLabel: 'mqtt broker',
        oneditprepare: function () {
            const customConfig = $('#node-input-configPath');
            const toggleCustom = () => {
                const hasCustom = !!customConfig.val();
                $('.mqtt-broker-generated-only').toggle(!hasCustom);
            };
            customConfig.on('input change', toggleCustom);
            toggleCustom();
        }
    });
</script>

<script type="text/html" data-help-name="mqtt-broker">
    <p>Starts and supervises a <a href="https://mosquitto.org/">Mosquitto</a>
       MQTT broker as a child process of Node-RED.</p>

    <h3>Prerequisites</h3>
    <p>The module ships with a post-install script that installs
       <code>mosquitto</code> automatically:</p>
    <ul>
        <li><b>Linux</b>: via apt, dnf, yum, zypper, pacman or apk. Needs
            root or passwordless <code>sudo</code>.</li>
        <li><b>macOS</b>: via Homebrew.</li>
        <li><b>Windows</b>: via <code>winget</code>
            (<code>EclipseFoundation.Mosquitto</code>), then Chocolatey,
            then a direct silent download of the official installer from
            <code>mosquitto.org</code>. The Windows installer requires
            administrator rights - run <code>npm install</code> in an
            elevated shell or accept the UAC prompt.</li>
    </ul>
    <p>You can rerun it any time from the module directory:
       <code>npm run install-mosquitto</code>. To suppress it during
       <code>npm install</code>, set
       <code>SKIP_MOSQUITTO_INSTALL=1</code>. To pin the Windows fallback
       installer version, set <code>MOSQUITTO_WIN_VERSION=2.0.20</code>.</p>

    <h3>Self-heal on first deploy</h3>
    <p>If the binary is missing when the node first starts, the runtime
       runs the installer once and only then spawns the broker. On
       Windows the installer can surface a UAC prompt that
       <code>npm install</code> couldn't show during palette install -
       accept it and the node moves to <code>running</code>.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt>
        <dd>Control command: <code>start</code>, <code>stop</code>,
            <code>restart</code>, <code>status</code>, <code>install</code>,
            <code>topics</code>, or <code>get</code>. Object form:
            <code>{ command: 'restart' }</code>.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>For <code>get</code>: the topic name to fetch. Also accepted
            as <code>payload.topic</code>.</dd>
    </dl>

    <h3>Topic inspection</h3>
    <p>The node maintains an in-memory map of every topic it has seen
       since the broker started, together with the last payload, QoS,
       retain flag, and timestamp. This uses an internal MQTT client
       that subscribes to <code>#</code>. Memory grows with the number
       of distinct topics.</p>
    <ul>
        <li><code>payload: "topics"</code> -> list of all topic names,
            sorted.</li>
        <li><code>payload: { command: "get", topic: "foo/bar" }</code>
            or <code>payload: "get"</code> with
            <code>msg.topic = "foo/bar"</code> -> last value for that
            topic (as both decoded string and raw Buffer).</li>
    </ul>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>mosquitto/stdout</code>, <code>mosquitto/stderr</code>,
            <code>mosquitto/status</code>, <code>mosquitto/install</code>,
            <code>mosquitto/topics</code>, or <code>mosquitto/get</code>.</dd>
        <dt>payload <span class="property-type">string | object</span></dt>
        <dd>Log lines, status object, topic list, or
            <code>{ topic, found, value, buffer, qos, retain, timestamp }</code>
            for <code>get</code>.</dd>
    </dl>

    <h3>Details</h3>
    <p>If a custom config file is supplied, all other settings on the node
       are ignored - the file is passed verbatim to
       <code>mosquitto -c</code>. Otherwise, a temporary config is generated
       from the fields above. The broker starts on deploy and is stopped
       cleanly when the node is redeployed or Node-RED shuts down.</p>
    <p>If the broker exits unexpectedly, the node will restart it after
       five seconds.</p>
</script>
